name: Publish Release

# Fires when a maintainer clicks "Publish release" on a draft in the GitHub UI
# (or otherwise un-drafts a non-prerelease release). The release.yml workflow
# builds, verifies, and uploads assets to a draft; this workflow runs the
# public-facing side-effects (docker push + gh-pages redirect) after a human
# has reviewed and published the release notes.
#
# workflow_dispatch lets a maintainer re-run the public-facing side-effects for
# an already-published release (e.g. after a failed run) without unpublishing it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish side-effects for (e.g. v2026-07-23)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve-tag:
    name: "Resolve release tag"
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: nix-enabled-runners
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISPATCH_TAG: ${{ github.event.inputs.tag }}
      EVENT_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Resolve and validate the release tag
        id: resolve
        shell: nix shell --quiet nixpkgs#gh -c bash -e {0}
        run: |
          # An explicit workflow_dispatch input is a human decision: trust it
          # verbatim, so re-running side-effects for any tag still works.
          if [ -n "$DISPATCH_TAG" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
            echo "using dispatch tag: $DISPATCH_TAG"
            exit 0
          fi

          tag="$EVENT_TAG"

          # Publishing a draft whose tag GitHub has not materialised yields a
          # placeholder "untagged-<hash>" in the release payload, and a real git
          # tag by that name. Seen 2026-07-23 and 2026-09-16. Each time every
          # downstream step that interpolates the tag failed, with two
          # unrelated-looking errors: "no assets match the file pattern" and
          # "couldn't find remote ref refs/heads/release-candidate/untagged-...".
          # Asset names always carry the intended tag, so recover it from them.
          case "$tag" in
            untagged-*)
              echo "::warning::release payload carried placeholder tag '$tag'; recovering it from asset names"
              tag=$(gh release view "$EVENT_TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --json assets \
                      --jq '.assets[].name' \
                    | sed -n 's/^cardano-wallet.*-\(v[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)-.*$/\1/p' \
                    | sort -u | head -1)
              ;;
          esac

          if ! printf '%s' "$tag" | grep -qE '^v[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::could not resolve a release tag (payload='$EVENT_TAG', resolved='$tag')."
            echo "::error::Fix the release's tag, then re-run this workflow via workflow_dispatch with an explicit tag."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $tag"

  push-docker:
    name: "Push Docker Image"
    # Skip for prereleases (nightly/test are published as prereleases and
    # already had their docker image pushed by release.yml).
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: nix-enabled-runners
    needs: resolve-tag
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Download docker-image asset
        shell: nix shell --quiet nixpkgs#gh -c bash -e {0}
        run: |
          mkdir -p docker-image
          gh release download "$TAG" \
            --repo cardano-foundation/cardano-wallet \
            --pattern "cardano-wallet-${TAG}-docker-image.tgz" \
            --dir docker-image

      - name: Login to Docker Hub
        run: docker login -u cfhal -p "${{ secrets.DOCKER_HUB_TOKEN }}"

      - name: Load and push Docker image
        run: |
          REPO="cardanofoundation/cardano-wallet"
          image_file=$(find docker-image -type f | head -1)
          echo "Loading docker image from: $image_file ($(stat -c%s "$image_file") bytes)"
          load_output=$(docker load -i "$image_file")
          echo "$load_output"

          LOADED_IMAGE=$(echo "$load_output" | grep -oP 'Loaded image: \K.*')
          echo "Loaded image: $LOADED_IMAGE"
          docker tag "$LOADED_IMAGE" "$REPO:$TAG"
          docker push "$REPO:$TAG"

          docker tag "$REPO:$TAG" "$REPO:latest"
          docker push "$REPO:latest"

  update-docs:
    name: "Update Documentation Links"
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: nix-enabled-runners
    needs: resolve-tag
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update redirects
        run: |
          cd releases
          ./make_redirects.sh "$TAG"

      - name: Push updates
        run: git push origin gh-pages

  merge-back:
    name: "Create merge-back PR"
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: nix-enabled-runners
    needs: resolve-tag
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      MERGE_BACK_HEAD_BRANCH: release-candidate/${{ needs.resolve-tag.outputs.tag }}
      MERGE_BACK_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure merge-back pull request
        shell: nix shell --quiet nixpkgs#gh -c bash -e {0}
        run: ./scripts/release/merge-back-pr.sh
