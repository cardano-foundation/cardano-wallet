name: Linux Mithril Sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build wallet and node"
    runs-on: nix-enabled-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build derivations
        run: nix build --quiet .#cardano-wallet .#cardano-node .#cardano-cli

  mithril-sync:
    name: "Mainnet Boot Sync with Mithril"
    needs: build
    runs-on: nix-enabled-runners
    timeout-minutes: 250
    env:
      SUCCESS_STATUS: ready
      NODE_LOGS_FILE: ./logs/node.log
      WALLET_LOGS_FILE: ./logs/wallet.log
      CLEANUP_DB: "true"
      # The node config selects the V2InMemory ledger backend, which only loads
      # an in-memory snapshot. Leaving the flavour unset keeps the downloaded
      # snapshot as it is; converting it to LMDB makes the node skip it and
      # replay the ledger from genesis.
      NETWORK: mainnet
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Mithril snapshot and sync
        working-directory: run/mainnet/nix
        run: |
          rm -rf logs databases
          mkdir -p logs
          ./snapshot.sh
          # Temporary: the runner has vanished mid-sync leaving no log. Print
          # memory figures to the job log every minute; stops with this step.
          (
            while kill -0 $$ 2>/dev/null; do
              echo "=== memory $(date -u +%FT%TZ) ==="
              free -m
              ps -eo rss,comm --sort=-rss | head -5
              dmesg 2>/dev/null | grep -i -E 'out of memory|killed process' | tail -3 || true
              sleep 60
            done
          ) &
          runtime_path=$(nix shell --quiet .#cardano-wallet .#cardano-node .#cardano-cli --command printenv PATH)
          export PATH="$runtime_path"
          exec bash ./run.sh sync 14400

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mithril-sync-logs
          path: run/mainnet/nix/logs/
