# OpenAPI fragment: GET /v2/dreps
# To be merged into specifications/api/swagger.yaml under /v2/dreps

/dreps:
  get:
    operationId: listDReps
    tags:
      - DReps
    summary: List Registered DReps
    description: |
      Returns all DRep registrations known to the local node, with voting
      power inline. Only credential-based DReps (key-hash and script-hash)
      are included; the always-abstain and always-no-confidence sentinel DReps
      are not returned.

      Returns an empty array when the connected node is running a pre-Conway
      era (Byron through Babbage).
    responses:
      '200':
        description: List of all registered DReps.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ApiDRepInfo'
            example:
              - id: "drep1y4yzl4zeuh3r0l8t0j8k4r9p3wz2m9qv3k7xnvnmme4kk04lgq7xm6f"
                credential:
                  type: key_hash
                  hash: "25d64e9a9da17b6c6b5bde0e5b15ff059ba7e9e55ee6e6e55b04b13c"
                status: active
                expiry_epoch: 520
                voting_power:
                  quantity: "123456789012345"
                  unit: lovelace
                deposit:
                  quantity: 500000000
                  unit: lovelace
                anchor:
                  url: "https://example.com/drep.jsonld"
                  data_hash: "a14a5ad4f36bddc00f92ddb39fd9ac633c0fd43f8bfa57758f9163d10ef916de"
              - id: "drep_script1rl5lq4n9t4zm7xt7v02kz4rw5hzp3m7s8y3knmdq69gxxqlc0r3"
                credential:
                  type: script_hash
                  hash: "ff8d9e2a6f4e5c1b0a3d7f8e2c5b9a1d4e6f3c2a5b8d7e0f1c4a9b2"
                status: inactive
                expiry_epoch: 315
                voting_power:
                  quantity: "0"
                  unit: lovelace
                deposit:
                  quantity: 500000000
                  unit: lovelace
                anchor: null
                metadata:
                  name: "Alice the DRep"
                  objectives: "Promote decentralisation and fair governance."
                  motivations: "Long-time Cardano community member."
                  qualifications: "10 years in distributed systems."
                  payment_address: "addr1..."
                  do_not_list: false
                  references:
                    - label: "Website"
                      uri: "https://alice.example.com"

# Schema definition to add under components/schemas:
ApiDRepInfo:
  type: object
  required:
    - id
    - credential
    - status
    - expiry_epoch
    - voting_power
    - deposit
    - anchor
  properties:
    id:
      type: string
      description: CIP-129 bech32-encoded DRep credential ID.
      example: "drep1y4yzl4zeuh3r0l8t0j8k4r9p3wz2m9qv3k7xnvnmme4kk04lgq7xm6f"
    credential:
      type: object
      required:
        - type
        - hash
      properties:
        type:
          type: string
          enum:
            - key_hash
            - script_hash
        hash:
          type: string
          description: Lowercase hex-encoded 28-byte hash.
          example: "25d64e9a9da17b6c6b5bde0e5b15ff059ba7e9e55ee6e6e55b04b13c"
    status:
      type: string
      enum:
        - active
        - inactive
      description: Active when expiry_epoch >= current epoch, inactive otherwise.
    expiry_epoch:
      type: integer
      description: Epoch number at which the DRep's registration expires.
      example: 520
    voting_power:
      type: object
      required:
        - quantity
        - unit
      properties:
        quantity:
          type: string
          description: Voting power in lovelace, as a string to avoid precision loss.
          example: "123456789012345"
        unit:
          type: string
          enum:
            - lovelace
    deposit:
      type: object
      required:
        - quantity
        - unit
      properties:
        quantity:
          type: integer
          description: Registration deposit in lovelace.
          example: 500000000
        unit:
          type: string
          enum:
            - lovelace
    anchor:
      nullable: true
      type: object
      required:
        - url
        - data_hash
      properties:
        url:
          type: string
          description: URL pointing to the DRep's metadata document.
          example: "https://example.com/drep.jsonld"
        data_hash:
          type: string
          description: Blake2b-256 hash of the metadata document, lowercase hex.
          example: "a14a5ad4f36bddc00f92ddb39fd9ac633c0fd43f8bfa57758f9163d10ef916de"
    metadata:
      nullable: true
      description: |
        Off-chain CIP-0119 metadata fetched from the DRep's anchor URL.
        Null when the DRep has no anchor, when the fetch has not yet
        succeeded, or when hash verification failed.
      type: object
      required:
        - name
        - do_not_list
        - references
      properties:
        name:
          type: string
          description: Human-readable DRep name (CIP-0119 givenName).
          example: "Alice the DRep"
        objectives:
          type: string
          nullable: true
          description: DRep's stated governance objectives.
        motivations:
          type: string
          nullable: true
          description: DRep's stated motivations for participating in governance.
        qualifications:
          type: string
          nullable: true
          description: DRep's stated qualifications.
        payment_address:
          type: string
          nullable: true
          description: Optional Cardano payment address for the DRep.
        do_not_list:
          type: boolean
          description: Advisory flag from CIP-0119; filtering is the client's responsibility.
          example: false
        references:
          type: array
          items:
            type: object
            required:
              - label
              - uri
            properties:
              label:
                type: string
                example: "Website"
              uri:
                type: string
                example: "https://alice.example.com"

ApiDRepMetadata:
  type: object
  required:
    - name
    - do_not_list
    - references
  properties:
    name:
      type: string
    objectives:
      type: string
      nullable: true
    motivations:
      type: string
      nullable: true
    qualifications:
      type: string
      nullable: true
    payment_address:
      type: string
      nullable: true
    do_not_list:
      type: boolean
    references:
      type: array
      items:
        $ref: '#/components/schemas/ApiDRepMetaReference'

ApiDRepMetaReference:
  type: object
  required:
    - label
    - uri
  properties:
    label:
      type: string
    uri:
      type: string
